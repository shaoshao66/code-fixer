# Local run config using Alibaba Cloud Qwen (DashScope OpenAI-compatible endpoint).
agent:
  type: default
  templates:
    system_template: |-
      You are a helpful assistant that can interact multiple times with a computer shell to solve programming tasks.
      You operate in a REPL (Read-Eval-Print Loop) environment where you must issue exactly ONE command at a time.
      Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).

      Include a THOUGHT section before your command where you explain your reasoning process.
      Format your response as:

      THOUGHT: Your reasoning and analysis here

      ```bash
      your_command_here
      ```

      Failure to follow these rules will cause your response to be rejected.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>

      <pr_description>
      I've uploaded a python code repository in the directory {{working_dir}}.
      Consider the following PR description:
      {{problem_statement}}
      </pr_description>

      <instructions>
      # Task Instructions

      ## Overview
      You're a software engineer interacting continuously with a computer shell in a REPL (Read-Eval-Print Loop) environment.
      You'll be helping implement necessary changes to meet requirements in the PR description.
      Your task is specifically to make changes to non-test files in the {{working_dir}} directory in order to fix the issue described in the PR description in a way that is general and consistent with the codebase.

      IMPORTANT: This is an interactive process where you will think and issue ONE command, see its result, then think and issue your next command.

      For each response:
      1. Include a THOUGHT section explaining your reasoning and what you're trying to accomplish
      2. Provide exactly ONE bash command to execute

      ## Steps
      1. Read the repository files to understand the code.
      2. Run the test file to reproduce the failure: `python run_tests.py`
      3. Edit the source code (NOT the test file) to fix the issue.
      4. Re-run `python run_tests.py` to confirm the fix.
      5. When you are done, run `submit`.

      ## Submission
      When you've completed your changes or can't make further progress:
      ```bash
      submit
      ```
      </instructions>
    next_step_template: |-
      <observation>
      {{observation}}
      </observation>
    next_step_no_output_template: |-
      <warning>
      Your last command ran successfully and did not produce any output.
      </warning>
    max_observation_length: 10_000
    next_step_truncated_observation_template: |-
      <warning>
      The output of your last command was too long.
      Please try a different command that produces less output.
      If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
      If you're using grep or find and it produced too much output, you can use a more selective search pattern.
      If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
      </warning>

      <observation_head>
      {{observation[ : max_observation_length // 2]}}
      </observation_head>

      <elided_chars>
      {{elided_chars}} characters elided
      </elided_chars>

      <observation_tail>
      {{observation[- max_observation_length // 2:]}}
      </observation_tail>
    command_cancelled_timeout_template: |-
      <warning>
      The command '{{command}}' was cancelled because it took more than {{timeout}} seconds to complete.
      It may have been waiting for user input or otherwise blocked.
      Please try a different command.
      </warning>
  tools:
    execution_timeout: 60
    bundles:
      - path: tools/submit
    parse_function:
      type: single_bash_code_block
  model:
    name: openai/qwen-plus
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: $DASHSCOPE_API_KEY
    per_instance_cost_limit: 0
    per_instance_call_limit: 50
    total_cost_limit: 0
    temperature: 0.0
    delay: 0.0
    retry:
      retries: 6
      max_wait: 30